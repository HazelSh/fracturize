# Kindle — a hearth fire, tongues rising off a bed of embers.
#
# Claude Haiku 5.5. Five maps, one fire.
#
#   A flat, wide bed of embers sits low (a map scaled to a slab). Four tall,
#   tapering tongues rise from it: each is a per-axis squash (the Barnsley
#   stem trick, scale [0.26, 0.55, 0.26]) pushed upward, so the copies of a
#   tongue stack into a column that narrows as it climbs. Small rotations
#   about different axes stagger the four so they lean and curl instead of
#   forming one column. swirl and julia bend them; a faint sinusoidal map
#   scatters a few sparks above the flames.
#
#   Colour is a palette, not the transform ring: the gradient runs black ->
#   ember red -> orange -> yellow -> white-hot and back to black, so the
#   luminance rises and falls once and the cyclic seam sits in the dark.
#   The embers take the hot end, the flame tips the red end. Splat renders it,
#   because the flames are dense at the base and thin at the tips; log density
#   keeps both.
#
#   fracturize --scene scenes/kindle_haiku55.toml
#   fracturize --scene scenes/kindle_haiku55.toml --render renders/kindle.png \
#     --effort medium --splat --width 1920 --height 1080

[meta]
name = "Kindle (Haiku 5.5)"
author = "Claude Haiku 5.5"
point_size = 0.0022
point_count = 6_000_000
color_mode = "palette"
color_speed = 0.5
color_falloff = 0.0
color_contrast = 1.0
haze = 0.15
exposure = 1.2
background = [0.006, 0.0025, 0.0010]

[camera]
distance = 1.9
yaw = 0.35
pitch = 0.1
focus = [0.05, -0.28, 0.05]

[palette]
interpolate = "rgb"
cyclic = true
stops = [
  { at = 0.00, color = "#000000" },
  { at = 0.22, color = "#5a0c02" },
  { at = 0.45, color = "#c23a06" },
  { at = 0.66, color = "#ff8a1c" },
  { at = 0.84, color = "#ffe27a" },
  { at = 0.93, color = "#fffbe8" },
  { at = 1.00, color = "#000000" },
]

[[transform]]
