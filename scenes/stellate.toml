# Kaleidoscopic IFS study: every branch map carries absfold (the KIFS
# reflect-into-positive-octant fold), so the attractor is built from mirror
# facets; the swirl map bends them into curved blades. Best in splat mode.
[meta]
name = "Stellate"
author = "Claude Fable 5"
point_size = 0.0012
point_count = 6_000_000
color_falloff = 0.7
color_contrast = 2.2

[camera]
focus = [0.3, 0.45, 0.1]
distance = 2.3
pitch = 0.25

[[transform]]
name = "fold_a"
translation = [-0.52, -0.5, -0.48]
scale = 0.62
rotation = [45.0, 35.3, 0.0]
color = [0.2, 0.55, 0.85]
weight = 4.0
variations = { absfold = 1.0 }

[[transform]]
name = "fold_b"
translation = [-0.38, -0.56, -0.42]
scale = 0.6
rotation = [0.0, 45.0, 45.0]
color = [0.85, 0.75, 0.35]
weight = 4.0
variations = { absfold = 1.0 }

[[transform]]
name = "whirl"
translation = [0.42, 0.4, 0.38]
scale = 0.55
rotation = [0.0, 30.0, 0.0]
color = [0.75, 0.3, 0.5]
weight = 1.5
variations = { swirl = 0.5, linear = 0.5 }
