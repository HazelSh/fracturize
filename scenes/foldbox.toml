  [0.084, 0.501, 1, 0.668, 0, 0, 0, 0, 0, 0, 0, 0],
  [0.083, 0.5, 1, 0.667, 0, 0.015, 0.03, 0.02, 0, 0.015, 0.03, 0.02],
  [0.083, 0.499, 0.999, 0.666, 0.084, 0.499, 1, 0.666, 0.083, 0.498, 0.996, 0.663],
  [0.083, 0.504, 1, 0.67, 0, 0, 0, 0, 0, 0, 0, 0],
  [0.085, 0.505, 1, 0.666, 0, 0, 0, 0, 0, 0, 0, 0],
  [0.083, 0.5, 1, 0.665, 0.013, 0.078, 0.156, 0.105, 0.013, 0.077, 0.155, 0.104],
  [0.083, 0.503, 1, 0.671, 0.053, 0.329, 0.651, 0.431, 0.054, 0.326, 0.652, 0.433],
  [0.083, 0.507, 1, 0.663, 0, 0, 0, 0, 0, 0, 0, 0],
  [0.086, 0.504, 1, 0.668, 0, 0.007, 0.014, 0.009, 0, 0.007, 0.013, 0.009],
  [0.084, 0.506, 1, 0.669, 0.031, 0.19, 0.376, 0.249, 0.031, 0.187, 0.376, 0.25],
  [0.05, 0.05, 0.05, 0.05, 0.05, 0.05, 0.05, 0.05, 0.05, 0.05, 0.05, 1]
]

