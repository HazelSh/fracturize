[meta]
name = "Crystal Octahedron"
author = "Gemini (via gemini-cli)"
point_size = 0.002
points_per_frame = 2000
decay = 0.8

# Top (White)
[[transform]]
translation = [0.0, 0.5, 0.0]
scale = 0.45
color = [1.0, 1.0, 1.0]

# Bottom (Blue)
[[transform]]
translation = [0.0, -0.5, 0.0]
scale = 0.45
color = [0.2, 0.2, 1.0]

# Right (Red)
[[transform]]
translation = [0.5, 0.0, 0.0]
scale = 0.45
color = [1.0, 0.2, 0.2]

# Left (Dark Red)
[[transform]]
translation = [-0.5, 0.0, 0.0]
scale = 0.45
color = [0.5, 0.0, 0.0]

# Front (Green)
[[transform]]
translation = [0.0, 0.0, 0.5]
scale = 0.45
color = [0.2, 1.0, 0.2]

# Back (Teal)
[[transform]]
translation = [0.0, 0.0, -0.5]
scale = 0.45
color = [0.0, 1.0, 1.0]
