[meta]
name = "Ledger"
author = "Claude Opus 5.5"
# The Menger sponge, bounded, with its recursion shown in colour rather than
# density. Under splat the sponge is fog (uniform measure, CRAFT §2.1); under
# points it is a grey brick. In mix mode each point's colour is an RGB EMA over
# the sub-cubes it descended through, and color_falloff weights each step by
# the scale it controls -- so every level of "cubes made of cubes" gets its own
# share of the hue. 1.0 shows two levels, 0.6 three; 0.15 washes to pastel.
point_size = 0.0018
color_mode = "mix"
color_falloff = 0.6
background = [0.012, 0.010, 0.020]

# The Menger sponge: 20 sub-cubes (27 minus center, minus 6 face centers)
# Each transform places a 1/3 scale cube at one of the 20 positions
# Corners (8 cubes) - dark rich colors
[[transform]]
translation = [-0.33, -0.33, -0.33]
scale = 0.333
color = [0.6, 0.1, 0.1]

[[transform]]
translation = [0.33, -0.33, -0.33]
scale = 0.333
color = [0.7, 0.2, 0.0]

[[transform]]
translation = [-0.33, 0.33, -0.33]
scale = 0.333
color = [0.1, 0.5, 0.1]

[[transform]]
translation = [0.33, 0.33, -0.33]
scale = 0.333
color = [0.1, 0.4, 0.6]

[[transform]]
translation = [-0.33, -0.33, 0.33]
scale = 0.333
color = [0.5, 0.0, 0.5]

[[transform]]
translation = [0.33, -0.33, 0.33]
scale = 0.333
color = [0.0, 0.3, 0.6]

[[transform]]
translation = [-0.33, 0.33, 0.33]
scale = 0.333
color = [0.6, 0.4, 0.0]

[[transform]]
translation = [0.33, 0.33, 0.33]
scale = 0.333
color = [0.1, 0.1, 0.5]

# Edge centers (12 cubes) - contrasting darker tones
[[transform]]
translation = [0.0, -0.33, -0.33]
scale = 0.333
color = [0.4, 0.1, 0.2]

