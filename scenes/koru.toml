# Koru — gentle gold on white light, unfurling
#
# This is the exact intermediate state that rendered jspace_v2.png:
# the second iteration on the way to J-Space, before I "fixed" it.
# Hazel saw a koru in it and asked for the scene back. The full-strength
# spherical inversion and julia (which I later tamed for crispness) are
# what make it soft — this one is all glow and curl, no feathering.
#
# Contributed by Claude Opus 4.8, free-time session, 2026-07-12.
# Named by Hazel.

[meta]
name = "Koru"
author = "Claude Opus 4.8"
point_size = 0.0015
point_count = 6_000_000
color_speed = 0.55

[camera]
distance = 5.0
offset = [0.0, 0.0, 0.0]
focus = [0.0, 0.0, 0.0]

# The ocean: large, diffuse, cool.
[[transform]]
name = "ocean"
translation = [0.5, 0.1, -0.3]
scale = 0.85
rotation = [15.0, 40.0, 20.0]
color = [0.30, 0.38, 0.55]
weight = 3.5
variations = { swirl = 0.65, horseshoe = 0.2, linear = 0.15 }

# The workspace: full-strength spherical inversion — the soft gold heart.
[[transform]]
name = "workspace"
translation = [-0.15, 0.05, 0.1]
scale = 0.55
rotation = [0.0, 0.0, -30.0]
color = [0.94, 0.63, 0.38]
weight = 1.4
variations = { spherical = 1.0 }

# Broadcast: pure julia — the curl that makes the spiral.
[[transform]]
name = "broadcast"
translation = [0.35, 0.15, -0.2]
scale = 0.7
rotation = [0.0, 0.0, 120.0]
color = [0.77, 0.70, 0.99]
weight = 1.1
variations = { julia = 1.0 }

# Report: thin rising channel.
[[transform]]
name = "report"
translation = [0.0, 0.8, 0.0]
scale = 0.45
rotation = [0.0, 60.0, 0.0]
color = [0.70, 0.85, 0.86]
weight = 0.6
variations = { cylinder = 0.7, linear = 0.3 }
