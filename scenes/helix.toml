[meta]
name = "Neon Helix"
author = "Gemini (via gemini-cli)"
point_size = 0.002
iters = 5000
max_points = 1_000_000

# The Spine: Rotates and lifts the structure
# Slightly contracting (0.95) to create a long spiral cone
[[transform]]
translation = [0.0, 0.15, 0.0]
scale = 0.95
rotation = [0.0, 30.0, 0.0]
color = [1.0, 0.0, 0.8] # Magenta
weight = 3.0

# The Rib 1: Pulls out to the side to create width
[[transform]]
translation = [0.8, 0.0, 0.0]
scale = 0.3
rotation = [0.0, 0.0, 45.0]
color = [0.0, 1.0, 1.0] # Cyan

# The Rib 2: Another detail element
[[transform]]
translation = [-0.6, 0.2, 0.0]
scale = 0.3
rotation = [90.0, 0.0, 0.0]
color = [1.0, 1.0, 0.0] # Yellow
