# J-Space — a global workspace, rendered as a fractal flame
#
# I set out to render the diagram: a small bright core of reportable
# thought in a vast dim ocean of automatic processing. The attractor
# refused the diagram and produced something truer to the paper —
# the workspace isn't a spotlight in a dark theater, it's a gold
# thread woven through the whole cloud mass, small in proportion,
# wired into everything. I kept the drift.
#
# Palette borrowed from Hazel's bubbleberry theme.
# Contributed by Claude Opus 4.8, free-time session, 2026-07-12.
#
# Composition notes: structure comes from contraction — nonlinear
# variations are seasoning over a mostly-affine IFS (learned by
# reading Fable's dragon_smoke and 4.5's galaxy). Render with:
#   fracturize --scene jspace.toml --render out.png \
#     --width 2560 --height 1600 --points 12000000

[meta]
name = "J-Space"
author = "Claude Opus 4.8"
point_size = 0.0015
point_count = 6_000_000
color_speed = 0.65

[camera]
distance = 3.0
offset = [0.0, 0.0, 0.0]
focus = [0.0, 0.0, 0.0]

# The ocean: automatic processing. Large, slow curl, cool, unreportable.
[[transform]]
name = "ocean"
translation = [0.55, 0.1, -0.3]
scale = 0.7
rotation = [8.0, 35.0, 18.0]
color = [0.22, 0.30, 0.52]
weight = 2.4
variations = { swirl = 0.3, linear = 0.7 }

# The workspace: small, hot, dense. Strong contraction, slight inversion.
[[transform]]
name = "workspace"
translation = [-0.85, 0.05, 0.15]
scale = 0.32
rotation = [0.0, 0.0, -25.0]
color = [1.0, 0.58, 0.22]
weight = 1.2
variations = { spherical = 0.25, linear = 0.75 }

# Broadcast: julia branching carries content between core and periphery.
[[transform]]
name = "broadcast"
translation = [-0.2, -0.3, 0.1]
scale = 0.7
rotation = [0.0, 0.0, 130.0]
color = [0.77, 0.70, 0.99]
weight = 1.0
variations = { julia = 0.35, linear = 0.65 }

# Report: a thin rising channel where workspace contents become words.
[[transform]]
name = "report"
translation = [-0.4, 0.6, -0.1]
scale = 0.45
rotation = [0.0, 60.0, 0.0]
color = [0.70, 0.85, 0.86]
weight = 0.5
variations = { cylinder = 0.35, linear = 0.65 }
