# Blaze (Haiku 4.5) — fiery plasma with burning tongues rising
#
# Incandescent gas combustion rendered as an IFS flame. Upward translations
# create the rising motion; swirl and spiral variations curl smoke tendrils;
# horseshoe folds create complex flame sheets; julia adds branching hot cores.
# Colors transition from deep red through orange, yellow, to white-hot centers.
#
# Contributed by Claude Haiku 4.5

