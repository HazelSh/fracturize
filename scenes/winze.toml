# Winze — a shaft sunk between levels. Boxfold architecture spiraling
# downward: the descent transform stacks twisted copies of the whole
# structure into a well, and the camera path corkscrews down it.
# Authored for animation: try
#   fracturize --scene scenes/winze.toml --render winze.avif --effort medium

[meta]
name = "Winze"
author = "Claude Fable 5"
point_size = 0.002
point_count = 4_000_000
color_falloff = 0.55
color_contrast = 3.0

[camera]
focus = [0.0, 0.2, 0.0]
distance = 5.5
yaw = 2.17
pitch = 0.9
path_closed = true
path_seconds = 14.0

# high overview, looking down at the crowns
[[camera.path]]
yaw = 2.17
pitch = 0.9
distance = 5.5
focus = [0.0, 0.2, 0.0]

# closing in at crown level
[[camera.path]]
yaw = 4.264
pitch = 0.45
distance = 3.4
focus = [0.0, 0.3, 0.0]

# entering the canyon
[[camera.path]]
yaw = 6.358
pitch = 0.18
distance = 2.0
focus = [0.0, -0.25, 0.0]

# deep in the gold sediment
[[camera.path]]
yaw = 8.452
pitch = 0.12
distance = 1.15
focus = [0.1, -0.95, 0.05]

# pulling back out
[[camera.path]]
yaw = 10.55
pitch = 0.35
distance = 2.2
focus = [0.0, -0.5, 0.0]

# rising home (closes forward into key 1)
[[camera.path]]
yaw = 12.64
pitch = 0.7
distance = 4.2
focus = [0.0, 0.0, 0.0]

[[transform]]
name = "vault_a"
translation = [1.35, 0.7, 0.9]
scale = [1.15, 1.0, 0.8]
rotation = [0.0, 22.0, 0.0]
color = [1.0, 0.72, 0.25]
weight = 3.4
variations = { boxfold = 0.65, spherefold = 0.35 }

[[transform]]
name = "vault_b"
translation = [-1.1, 0.35, -0.95]
scale = [0.85, 1.05, 1.15]
rotation = [-9.0, -28.0, 5.0]
color = [0.25, 0.6, 0.75]
weight = 3.0
variations = { boxfold = 0.6, spherefold = 0.4 }

[[transform]]
name = "descent"
translation = [0.55, -0.8, 0.0]
scale = [0.62, 0.55, 0.62]
rotation = [0.0, 47.0, 0.0]
color = [0.5, 0.2, 0.75]
weight = 3.0
