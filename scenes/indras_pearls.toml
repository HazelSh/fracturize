# Indra's pearls in three dimensions — the limit set of a Schottky-type group.
#
# Seven balls with disjoint interiors: six of radius 1/sqrt 2 on the
# octahedron's axes at distance 1, each touching its four neighbours, and a
# core of radius 1 - 1/sqrt 2 at the origin touching all six. Each map is the
# inversion in one ball (affine to the unit sphere, `spherical`, post-affine
# back), so the walk is the group's random walk and the picture its limit set:
# every ball holds the images of the other six, each of those the images of
# the rest, down forever. Where balls touch the inversions compose to
# parabolics, which is what joins the dust into lace.
#
# Balls with disjoint interiors always generate a discrete group, and cutting
# each map's self-loop (inversions are involutions) makes every walk a reduced
# word, unique: no relation is wasting points. Compare apollonian_spheres,
# whose balls overlap and whose words are not unique.
#
# The core is what makes it 3D. Without it, all six balls are orthogonal to
# the sphere of radius 1/sqrt 2, every inversion preserves that sphere, and the
# limit set is a gasket drawn on its surface: a shell, nothing inside. With it
# the shell breaks into star-shaped shards and the core's images (cream) sit
# behind them, visible through the gaps from every side.
#
#   fracturize -s scenes/indras_pearls.toml --splat
#   fracturize -s scenes/indras_pearls.toml --splat --orbit-grid 2x2 \
#     -r renders/pearls.png --width 700 --height 500

