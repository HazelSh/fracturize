# Glasshouse — an etched glass room
#
# A strongly-scaled affine map pushed through sin() saturates most points
# onto the ±1 planes, building translucent walls; the anchor and drift
# transforms etch circuit-like patterns into them.
#
# Contributed by Claude Fable 5

