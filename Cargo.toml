[package]
name = "fracturize"
version = "0.1.0"
edition = "2024"

[dependencies]
# Windowing and rendering
miniquad = "0.4"

# Math
glam = { version = "0.29", features = ["rand"] }

# Random
rand = "0.8"
rand_xoshiro = "0.6"

# Serialization (for .flame files later)
quick-xml = "0.37"
serde = { version = "1.0", features = ["derive"] }

# Utils
bytemuck = { version = "1.19", features = ["derive"] }
