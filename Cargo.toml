[package]
name = "fracturize"
version = "0.1.0"
edition = "2024"
# Shown in the about block of the Controls window (src/ui/shortcuts.rs) via
# CARGO_PKG_REPOSITORY. Matches the `origin` remote.
repository = "https://github.com/HazelSh/fracturize"

[dependencies]
# Windowing and rendering
wgpu = "29"
winit = "0.30"
pollster = "0.4"

# Immediate-mode UI (Phase 1: scaffold + TextEntry shim only, see AGENTS.md)
egui = "0.35"
egui-wgpu = "0.35"
egui-winit = "0.35"
# egui-phosphor omitted: no release matching egui 0.35 exists yet as of this
# writing (latest 0.12.0 pins egui ^0.34); add in Phase 2 once available.

# Logging
env_logger = "0.11"
log = "0.4"

# Math
glam = { version = "0.29", features = ["rand", "bytemuck"] }

# Random
rand = "0.8"
rand_xoshiro = "0.6"

# Serialization
quick-xml = "0.37"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"

# CLI. wrap_help so `--help`'s prose wraps to the terminal instead of running
# off the edge — the flag list is grouped into sections for reading, and that
# only pays off if the paragraphs under it are readable too.
clap = { version = "4", features = ["derive", "wrap_help"] }

# Utils
bytemuck = { version = "1.19", features = ["derive"] }
half = { version = "2.4", features = ["bytemuck"] }

# Image output
image = "0.25"
# Direct, for PNG text chunks: `image`'s convenience wrapper has no passthrough
# for them, and the still-render path drives `png::Encoder` itself. Free — image
# already pulls this exact version in transitively.
png = "0.18"
# Content fingerprint for the render record: tells "the scene as rendered" from
# "the scene as it is now". Not hand-rolled — a hash function is precisely the
# wrong place to save a dependency.
sha2 = "0.10"
# Animated AVIF encoding (already built for image's still-AVIF support via
# ravif; keep default-features off + threading to share the same build)
rav1e = { version = "0.8.1", default-features = false, features = ["threading"] }
# H.264 encoding for .mp4 output. rav1e only speaks AV1, and the platforms
# that loop short clips want H.264 — see src/video.rs for why .mp4 is not
# just the AVIF bitstream in a different box. Cisco's encoder, BSD-2, built
# from vendored C by the default "source" feature (no system library, and no
# nasm needed — it falls back to the C kernels).
openh264 = "0.9"

# Clean Ctrl-C for long renders (see src/interrupt.rs): a signal handler that
# lets an accumulating render finish its lap and save rather than losing it.
# Already in the tree as a transitive dependency, so this costs nothing to
# fetch, and it is unix-only because that is where the signals are.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
