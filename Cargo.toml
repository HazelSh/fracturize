[package]
name = "fracturize"
version = "0.1.0"
edition = "2024"

[dependencies]
# Windowing and rendering
wgpu = "28.0"
winit = "0.30"
pollster = "0.4"

# Logging
env_logger = "0.11"
log = "0.4"

# Math
glam = { version = "0.29", features = ["rand", "bytemuck"] }

# Random
rand = "0.8"
rand_xoshiro = "0.6"

# Serialization
quick-xml = "0.37"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

# CLI
clap = { version = "4", features = ["derive"] }

# Utils
bytemuck = { version = "1.19", features = ["derive"] }
half = { version = "2.4", features = ["bytemuck"] }

# Text rendering
glyphon = { git = "https://github.com/grovesNL/glyphon" }

# Image output
image = "0.25"
